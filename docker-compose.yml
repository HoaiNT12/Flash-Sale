name: flashsale

x-resource-security: &resource-security
  APP_SECURITY_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
  APP_SECURITY_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
  APP_SECURITY_AUDIENCE: ${JWT_AUDIENCE:-flashsale-api}

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent http://localhost:$$SERVER_PORT/actuator/health > /dev/null"]
    interval: 10s
    timeout: 3s
    retries: 18
    start_period: 40s

services:
  postgres-primary:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_dev}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "wal_keep_size=256MB", "-c", "max_slot_wal_keep_size=1GB", "-c", "hot_standby=on"]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./infra/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:-repl_dev}
      PGAPPNAME: flashsale_replica
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && test \"$$(psql -U postgres -d postgres -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  auth-service:
    <<: *service-defaults
    build:
      context: .
      args:
        MODULE: auth-service
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev}
      APP_SECURITY_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      APP_SECURITY_AUDIENCE: ${JWT_AUDIENCE:-flashsale-api}
      AUTH_KEY_DIRECTORY: /keys
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-Demo@123}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin@123}
      AUTH_ORDER_SERVICE_SECRET: ${AUTH_ORDER_SERVICE_SECRET:-order_dev_secret}
    volumes:
      - auth-keys:/keys
    depends_on:
      postgres-primary:
        condition: service_healthy

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      args:
        MODULE: inventory-service
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *resource-security
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
      APP_CATALOG_JDBC_URL: jdbc:postgresql://postgres-replica:5432/inventorydb
      APP_CATALOG_USERNAME: inventory
      APP_CATALOG_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
      DEMO_ENABLED: "false"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    build:
      context: .
      args:
        MODULE: payment-service
    ports: ["127.0.0.1:8083:8083"]
    environment:
      <<: *resource-security
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev}
      DEMO_ENABLED: "false"
    depends_on:
      postgres-primary:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        MODULE: order-service
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *resource-security
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/ordersdb
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev}
      INVENTORY_BASE_URL: http://inventory-service:8082
      PAYMENT_BASE_URL: http://payment-service:8083
      AUTH_BASE_URL: http://auth-service:8081
      SERVICE_CLIENT_SECRET: ${AUTH_ORDER_SERVICE_SECRET:-order_dev_secret}
      SAGA_CONCURRENCY: 16
    depends_on:
      postgres-primary:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  primary-data:
  replica-data:
  auth-keys:
