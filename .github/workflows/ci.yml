name: build-and-consistency
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Docker integration tests can run
        run: docker info
      - name: Build and run unit and PostgreSQL concurrency tests
        run: bash mvnw -B -ntp verify
      - name: Start replicated stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: End-to-end checkout and compensation
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Concurrent flash-sale consistency
        shell: pwsh
        run: ./scripts/load.ps1 -Requests 150 -Concurrency 24
      - name: Enable controlled downstream faults
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --wait --wait-timeout 120
      - name: Circuit breaker overload and recovery
        shell: pwsh
        run: ./scripts/overload.ps1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: '**/target/surefire-reports/*.xml'
      - name: Stop stack
        if: always()
        run: docker compose down
